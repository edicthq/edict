services:
  db:
    image: postgres:18-alpine
    environment:
      # The superuser, for administering Postgres. Edict itself connects as
      # the edict role that postgres-init.sh creates, which is not one.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: edict
      EDICT_DB_PASSWORD: ${EDICT_DB_PASSWORD:-edict}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-edict.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edict"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://edict:${EDICT_DB_PASSWORD:-edict}@db:5432/edict
      # Optional. Without it, Edict generates a secret on first boot and keeps it in Postgres.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The URL people reach Edict at. Set it to your public URL: sign-in only
      # works from this origin, and emailed links point here.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Comma-separated IPs or CIDR ranges of reverse proxies in front of Edict,
      # whose X-Forwarded-For is believed. Leave empty when clients connect directly.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Optional outgoing email through any SMTP provider (Resend, Postmark, SES,
      # Mailgun), like smtps://user:password@smtp.resend.com:465. Without it,
      # invites are links you share yourself.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # The largest attachment accepted, in bytes. 25 MB by default.
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-}
      # Optional. Store attachments in an S3-compatible bucket instead of the
      # app-data volume. Create the bucket first. S3_ENDPOINT is for services
      # other than AWS (Cloudflare R2, RustFS, Garage, MinIO); leave it empty
      # for AWS. Edict checks the bucket on boot and refuses to start without it.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Optional sign-in with Google, GitHub or any OpenID Connect provider
      # (Authentik, Keycloak). Each turns on when its id and secret are set.
      # Redirect URIs: <BETTER_AUTH_URL>/api/auth/callback/google, .../github,
      # and .../callback/oidc. OIDC_NAME labels the sign-in button.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      # Webhooks go only to public addresses. Set to "allow" to let them reach
      # private ones too, like an agent runner on this host's own network.
      PRIVATE_WEBHOOK_TARGETS: ${PRIVATE_WEBHOOK_TARGETS:-}
    volumes:
      # Attached files, unless S3_BUCKET is set. Several app replicas need a
      # shared volume here, or S3.
      - app-data:/srv/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
  app-data:
