services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: edict
      POSTGRES_PASSWORD: edict
      POSTGRES_DB: edict
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edict -d edict"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://edict:edict@db:5432/edict
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
