services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: edict
      POSTGRES_PASSWORD: edict
      POSTGRES_DB: edict
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edict -d edict"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://edict:edict@db:5432/edict
      # Optional. Without it, Edict generates a secret on first boot and keeps it in Postgres.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      # The URL people reach Edict at, when it differs from http://localhost:3000.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      # Comma-separated IPs or CIDR ranges of reverse proxies in front of Edict,
      # whose X-Forwarded-For is believed. Leave empty when clients connect directly.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
