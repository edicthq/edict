name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request replaces the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @edicthq/web exec playwright install --with-deps chromium webkit
      - name: End-to-end tests
        run: pnpm e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  # The image self-hosters run: it builds, migrates an empty Postgres on
  # boot and answers /health. Publishing to GHCR is the release workflow's job.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: edict:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot it against Postgres
        run: |
          docker network create edict
          docker run -d --name db --network edict -e POSTGRES_USER=edict -e POSTGRES_PASSWORD=edict -e POSTGRES_DB=edict postgres:18-alpine
          docker run -d --name app --network edict -p 3000:3000 \
            -e DATABASE_URL=postgres://edict:edict@db:5432/edict \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            edict:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs app
          exit 1
