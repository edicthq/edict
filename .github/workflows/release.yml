name: Release

# Pushing a tag like v1.4.2 releases the commit it points at: CI runs on it,
# then the image goes to GHCR, @edicthq/client to npm, and the notes from
# CHANGELOG.md to a GitHub Release. docs/releasing.md has the steps.
on:
  push:
    tags: ["v*"]

# One release per tag at a time, and never cancelled halfway through publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Each job asks for what it needs and no more.
permissions: {}

env:
  IMAGE: ghcr.io/edicthq/edict

# Actions are pinned to commits; the comment names the release each one is.
jobs:
  # Fails before anything runs if the tag, the package versions and the
  # changelog disagree, and works out which floating tags this release takes.
  plan:
    if: github.repository == 'edicthq/edict'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      latest: ${{ steps.plan.outputs.latest }}
      image-tags: ${{ steps.plan.outputs.image-tags }}
      npm-tag: ${{ steps.plan.outputs.npm-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Plan the release
        id: plan
        run: |
          git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' > "$RUNNER_TEMP/tags"
          node scripts/release.mjs plan "$GITHUB_REF_NAME" < "$RUNNER_TEMP/tags" | tee -a "$GITHUB_OUTPUT"

  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Each platform builds on its own runner, natively, and is pushed by digest
  # only. Nothing is tagged until both have booted.
  image:
    needs: [plan, ci]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No build cache: a published image is built from the tagged source alone.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Edict
            org.opencontainers.image.description=An open-source issue tracker where AI agents are members of your team
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Boot it against Postgres
        run: docker/boot-check.sh "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Keep the digest for tagging
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the platforms into one multi-arch image under every tag the plan gave
  # it: always the exact version, and 1.4, 1 and latest when this is the newest
  # release they cover.
  image-tags:
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          for tag in $IMAGE_TAGS; do args+=(--tag "${IMAGE}:${tag}"); done
          args+=(--annotation "index:org.opencontainers.image.description=An open-source issue tracker where AI agents are members of your team")
          args+=(--annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}")
          args+=(--annotation "index:org.opencontainers.image.version=${VERSION}")
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          IMAGE_TAGS: ${{ needs.plan.outputs.image-tags }}
          VERSION: ${{ needs.plan.outputs.version }}

  # After the image, so a failed image never leaves a client on npm for a
  # server nobody can run. Publishes through npm's trusted publishing (OIDC),
  # with provenance; NPM_TOKEN is only for the very first publish, before the
  # package exists to configure that on.
  npm:
    needs: [plan, image-tags]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile --filter @edicthq/client
      - name: Build
        run: pnpm --filter @edicthq/client run build
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install npm
        run: npm install --global npm@11.21.1
      - name: Publish @edicthq/client
        working-directory: packages/client
        run: |
          if npm view "@edicthq/client@${VERSION}" version > /dev/null 2>&1; then
            echo "@edicthq/client@${VERSION} is already on npm"
          else
            npm publish --access public --provenance --tag "$NPM_TAG"
          fi
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Last, so the update check and the desktop updater, which read GitHub
  # releases, never see a release whose image or client is not out yet.
  github-release:
    needs: [plan, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the notes
        run: |
          {
            node scripts/release.mjs notes "$VERSION"
            echo
            echo "## Install"
            echo
            echo "- Image: \`${IMAGE}:${VERSION}\` for amd64 and arm64. Upgrade a compose install with \`docker compose pull && docker compose up -d\`."
            echo "- New install: put \`compose.yml\` and \`postgres-init.sh\` from below in one folder and run \`docker compose up -d\`."
            echo "- API client: [\`@edicthq/client@${VERSION}\`](https://www.npmjs.com/package/@edicthq/client/v/${VERSION})"
          } > "$RUNNER_TEMP/notes.md"
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      # The compose files ride along, so self-hosters download them from
      # releases/latest/download/ instead of from a branch that may be ahead.
      - name: Create the release
        run: |
          flags=(--title "Edict ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --latest="$LATEST")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          assets=(docker/compose.yml docker/postgres-init.sh)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag "${flags[@]}" "${assets[@]}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          LATEST: ${{ needs.plan.outputs.latest }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
