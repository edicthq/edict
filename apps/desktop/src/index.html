<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect to Edict</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8f9fb;
        --surface: #fefeff;
        --ink: #161b22;
        --ink-2: #565b63;
        --line-strong: #caced3;
        --on-ink: #fbfcfd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0e11;
          --surface: #131619;
          --ink: #edeff1;
          --ink-2: #a7abb0;
          --line-strong: #32363b;
          --on-ink: #0b0c0e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(400px, 100%); display: flex; flex-direction: column; gap: 16px; }
      svg { width: 32px; height: 32px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0; color: var(--ink-2); text-wrap: pretty; }
      form { display: flex; flex-direction: column; gap: 8px; }
      label { font-weight: 500; }
      input {
        height: 36px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      button {
        height: 36px;
        border: 0;
        border-radius: 6px;
        background: var(--ink);
        color: var(--on-ink);
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; cursor: default; }
      [role="alert"]:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill="currentColor" d="M5 2h7a1 1 0 0 1 0 2H5v8h7a1 1 0 0 1 0 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" />
        <path fill="currentColor" d="M8.1 6h1.8A1.1 1.1 0 0 1 11 7.1v1.8A1.1 1.1 0 0 1 9.9 10H8.1A1.1 1.1 0 0 1 7 8.9V7.1A1.1 1.1 0 0 1 8.1 6Z" />
      </svg>
      <h1>Connect to your Edict</h1>
      <p>Edict runs on a server your team hosts. The app opens it and keeps it a hotkey away.</p>
      <form id="connect">
        <label for="address">Server address</label>
        <input id="address" name="address" type="text" inputmode="url" autocomplete="url" placeholder="edict.example.com" required autofocus />
        <p id="error" role="alert"></p>
        <button type="submit">Connect</button>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
