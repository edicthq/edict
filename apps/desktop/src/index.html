<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect to Edict</title>
    <link rel="stylesheet" href="shell.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main { width: min(360px, 100%); display: flex; flex-direction: column; gap: 16px; }
      svg { width: 32px; height: 32px; margin-bottom: 8px; }
      h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 600; letter-spacing: -0.022em; }
      main > p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.6; text-wrap: pretty; }
      form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
      label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
      .primary { margin-top: 4px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path fill="currentColor" d="M5 2h7a1 1 0 0 1 0 2H5v8h7a1 1 0 0 1 0 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" />
        <path fill="currentColor" d="M8.1 6h1.8A1.1 1.1 0 0 1 11 7.1v1.8A1.1 1.1 0 0 1 9.9 10H8.1A1.1 1.1 0 0 1 7 8.9V7.1A1.1 1.1 0 0 1 8.1 6Z" />
      </svg>
      <h1>Connect to your Edict instance</h1>
      <p>Edict runs on an instance your team hosts. The app opens it and keeps it a hotkey away. You can add more instances later.</p>
      <form id="connect">
        <label for="address">Instance address</label>
        <input class="field" id="address" name="address" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="edict.example.com" required autofocus />
        <p id="error" class="error" role="alert"></p>
        <button class="primary" type="submit">Connect</button>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
