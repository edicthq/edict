[package]
name = "edict-desktop"
version = "0.0.1"
description = "Edict's desktop app: a Tauri shell around the server's web UI"
authors = ["Amirali Beigi"]
license = "AGPL-3.0-only"
repository = "https://github.com/edicthq/edict"
edition = "2021"
rust-version = "1.80"

[lib]
name = "edict_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
tauri-plugin-store = "2.5.0"
tauri-plugin-updater = "2.14.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-window-state = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
